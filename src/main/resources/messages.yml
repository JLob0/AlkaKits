# Mensagem de chat disparada junto com o feedback (som/particula/titulo/fireworks) de
# cada resultado - ver FeedbackService e config.yml -> feedback.
status:
  CLAIMABLE: "<green>✔ Voce recebeu o kit <white><kit></white> <gray>(nivel <white><nivel></white><gray>)!"
  PURCHASABLE: "<green>✔ Voce comprou o nivel <white><nivel></white> <gray>do kit <white><kit></white><gray>!"
  LOCKED: "<red>✖ Voce nao tem permissao pra esse kit."
  REQUIREMENT_NOT_MET: "<red>✖ Voce nao cumpre os requisitos desse kit."
  ON_BUY_COOLDOWN: "<yellow>⏳ Aguarde antes de comprar o proximo nivel."
  ON_CLAIM_COOLDOWN: "<yellow>⏳ Voce ja reivindicou esse kit recentemente."
  INSUFFICIENT_FUNDS: "<red>✖ Voce nao tem saldo suficiente pra esse nivel."
  FULL_INVENTORY: "<red>✖ Seu inventario esta cheio."
  MAX_USES_REACHED: "<red>✖ Voce ja usou esse kit o maximo de vezes permitido."
  MAX_LEVEL_REACHED: "<gray>Esse kit ja esta no nivel maximo."

menu:
  voltar-nome: "<gray><bold>← Voltar</bold>"
  voltar-lore:
    - "<dark_gray>Clique para voltar"

  categorias-header-nome: "<gradient:#FFAA00:#FFE055><bold>✦ Central de Kits ✦</bold></gradient>"
  categorias-header-lore:
    - "<dark_gray><st>――――――――――――――――――――――</st>"
    - "<gray>Escolha uma categoria abaixo"
    - "<gray>para ver os kits disponiveis."
    - ""
    - "<yellow>➤ <gray>Kits gratuitos, de VIP e"
    - "<yellow>➤ <gray>bonus exclusivos te esperam!"
    - "<dark_gray><st>――――――――――――――――――――――</st>"

  kit-nivel-lore:
    - ""
    - "<dark_gray><st>――――――――――――――――――</st>"
    - "<gray>Nivel atual: <white><atual><gray>/<white><maximo>"
    - "<yellow>➤ <gray>Clique para abrir"

  nivel-anterior-nome: "<gray><bold>← Nivel anterior</bold>"
  proximo-nivel-nome: "<gray><bold>Proximo nivel →</bold>"
  nivel-superado-nome: "<dark_gray>✔ Nivel ja superado"
  nivel-superado-lore:
    - "<gray>Voce ja esta num nivel mais"
    - "<gray>avancado deste kit."

  preview-info-nome: "<gradient:#FFAA00:#FFE055><bold>Nivel <nivel>/<maximo></bold></gradient>"
  preview-info-lore:
    - "<dark_gray><st>――――――――――――――――――</st>"
    - "<gray>Use as setas pra navegar"
    - "<gray>entre os niveis deste kit."
    - "<dark_gray><st>――――――――――――――――――</st>"

  botao:
    CLAIMABLE:
      nome: "<gradient:#55FF55:#00FF00><bold>✔ Clique para reivindicar!</bold></gradient>"
      lore:
        - "<gray>Seu kit esta pronto."
        - "<gray>Clique para receber os itens agora."
    PURCHASABLE:
      nome: "<gradient:#FFD700:#FFA500><bold>💰 Clique para comprar!</bold></gradient>"
      lore:
        - "<gray>Desbloqueie o proximo nivel"
        - "<gray>deste kit."
        - ""
        - "<yellow>Preco: <gold><preco> <white><moeda>"
    LOCKED:
      nome: "<red>✖ Voce nao tem permissao."
      lore:
        - "<gray>Este kit exige uma permissao"
        - "<gray>que voce ainda nao possui."
    REQUIREMENT_NOT_MET:
      nome: "<red>✖ Requisitos nao cumpridos."
      lore:
        - "<gray>Voce nao cumpre todos os"
        - "<gray>requisitos deste nivel."
    ON_BUY_COOLDOWN:
      nome: "<yellow>⏳ Aguarde pra comprar de novo."
      lore:
        - "<gray>Voce comprou um nivel deste"
        - "<gray>kit recentemente."
    ON_CLAIM_COOLDOWN:
      nome: "<yellow>⏳ Aguarde o cooldown."
      lore:
        - "<gray>Voce ja reivindicou este"
        - "<gray>kit recentemente."
    INSUFFICIENT_FUNDS:
      nome: "<red>✖ Saldo insuficiente."
      lore:
        - "<gray>Voce nao tem dinheiro suficiente"
        - "<gray>pra comprar este nivel."
        - ""
        - "<yellow>Preco: <gold><preco> <white><moeda>"
    FULL_INVENTORY:
      nome: "<red>✖ Inventario cheio."
      lore:
        - "<gray>Abra espaco no seu inventario"
        - "<gray>antes de reivindicar."
    MAX_USES_REACHED:
      nome: "<red>✖ Usos esgotados."
      lore:
        - "<gray>Voce ja usou este kit o maximo"
        - "<gray>de vezes permitido."
    MAX_LEVEL_REACHED:
      nome: "<gray>✦ Nivel maximo atingido."
      lore:
        - "<gray>Este kit nao tem mais niveis"
        - "<gray>para desbloquear."
