      lore:
        - "<dark_gray><st>――――――――――――――――――</st>"
        - "<gray>Kits recorrentes exclusivos"
        - "<gray>pra membros <#55FF55>VIP<gray>."
        - "<dark_gray><st>――――――――――――――――――</st>"
