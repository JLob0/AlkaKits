      name: "<green><bold>✦ Kits Gratis ✦</bold>"
      lore:
        - "<dark_gray><st>――――――――――――――――――</st>"
        - "<gray>Kits disponiveis pra"
        - "<gray>todos os jogadores."
        - "<dark_gray><st>――――――――――――――――――</st>"
  vip:
