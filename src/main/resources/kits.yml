# Kits do AlkaKits - crie quantos quiser, niveis 1-indexados sem buracos por kit.
# "requisitos" no kit inteiro se somam aos do nivel individual.
#
# Kits vip/vip+/mvp/mvp+/alka/drakkar migrados do AlkaVips em 2026-08-13 (o
# KitManager/VipKit/KitsMenu proprios do AlkaVips foram removidos - ver memoria
# project-alkakits) - so os RECORRENTES (diario/semanal/mensal). Gateados via
# requisito PLACEHOLDER: %alkavips_has_vip_<tier>% (true/false, TODOS os VIPs ativos
# do jogador, nao so o "selecionado"). <tier> e sempre o vipTypeId cru do AlkaVips:
# vip, vip+, mvp, mvp+, alka, drakkar (NAO o nome do grupo do LuckPerms, que e
# diferente: vipplus/mvpplus).
#
# O "kit de ativacao" (bonus unico ao comprar 30+ dias de VIP) FICOU no AlkaVips
# mesmo, nao migrou pra ca - decisao deliberada (2026-08-13): se um servidor rodar
# AlkaVips sem o AlkaKits instalado, o bonus de ativacao ainda precisa funcionar,
# ja que e parte do fluxo de compra do VIP em si. Ver ActivationService#
# deliverActivationBonus e vips.yml -> activation-bonus por tier no AlkaVips.
#
# Consolidacao 2026-08-23: as 8 categorias antigas (free, vip, vip+, mvp, mvp+,
# alka, drakkar, booster) viraram so 3 no menu raiz: free/vip/exclusivos. Kits
# recorrentes de VIP (vip..drakkar) foram todos reapontados pra categoria "vip"
# unica (slots redistribuidos pra nao colidir na mesma tela). A categoria
# "booster" antiga (kit generico) foi substituida por kits reais dentro de
# "exclusivos" (booster_xp, booster_coins, founder, staff, voto, influencer).
# Import de ~40 kits novos (24 kits de rank gratis + 4 kits de boas-vindas de VIP
# + 4 kits exclusivos) veio de um material de referencia de outro plugin
# (drakkarkits) - so a estrutura/itens foram aproveitados, convertidos pro schema
# proprio do AlkaKits (campos em portugues, MiniMessage em vez de '&' legado).

categorias:
  free:
    nome: "<green>Kits Gratis"
    slot: 11
    icone:
